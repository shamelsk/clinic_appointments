services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinic_appointments
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
    ports: ["5432:5432"]
    volumes: ["clinic_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic_appointments"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  clinic_pgdata:
