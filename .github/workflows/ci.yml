name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: clinic, POSTGRES_PASSWORD: clinic, POSTGRES_DB: clinic_appointments }
        ports: ['5432:5432']
        options: >-\
          --health-cmd "pg_isready -U clinic -d clinic_appointments" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://clinic:clinic@localhost:5432/clinic_appointments?schema=public
      JWT_SECRET: test-secret-that-is-long-enough-for-ci
      CLINIC_TIMEZONE: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:generate
      - run: pnpm run db:validate
      - run: pnpm run db:migrate:deploy
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
